name: Generate Snake Animation

on:
  # Refresh twice a day
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual run from the Actions tab
  workflow_dispatch:
  # Regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ff6a2e&color_dots=#191715,#282522,#57534c,#98938b,#f2f0ec
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#d6470d&color_dots=#efece6,#e2ded6,#98938b,#6e6a63,#1a1816

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
