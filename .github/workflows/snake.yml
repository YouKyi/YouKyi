name: Generate Snake Animation

on:
  # Refresh twice a day
  schedule:
    - cron: "0 */12 * * *"
  # Allow manual run from the Actions tab
  workflow_dispatch:
  # Regenerate on every push to main
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: snake-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#bf00ff&color_dots=#161b22,#4a1a66,#7a1fa3,#bf00ff,#e879f9
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#8b00cc&color_dots=#ebedf0,#e0a8f5,#c44de0,#a020c0,#7a1fa3

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
