<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="900" height="28" fill="none" role="img" aria-label="">
  <defs>
    <linearGradient id="dl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BF00FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E879F9" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#BF00FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="dg" x="-50%" y="-400%" width="200%" height="900%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dgbig" x="-200%" y="-800%" width="500%" height="1700%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>

  <!-- base line -->
  <rect x="40" y="13" width="820" height="2" rx="1" fill="url(#dl)" filter="url(#dg)"/>

  <!-- center diamond node -->
  <g filter="url(#dg)" fill="#E879F9">
    <rect x="444" y="8" width="12" height="12" rx="2" transform="rotate(45 450 14)"/>
  </g>

  <!-- gliding comet: a single pass on load, then it fades out for good -->
  <g filter="url(#dg)">
    <circle cy="14" r="4" fill="#F3E8FF">
      <animate attributeName="cx" values="40;860;40" keyTimes="0;0.5;1" dur="7s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="0;1;1;1;0" keyTimes="0;0.05;0.5;0.95;1" dur="7s" repeatCount="1" fill="freeze"/>
    </circle>
    <circle cy="14" r="9" fill="#BF00FF" opacity="0.4" filter="url(#dgbig)">
      <animate attributeName="cx" values="40;860;40" keyTimes="0;0.5;1" dur="7s" repeatCount="1" fill="freeze"/>
      <animate attributeName="opacity" values="0.4;0.4;0" keyTimes="0;0.95;1" dur="7s" repeatCount="1" fill="freeze"/>
    </circle>
  </g>
</svg>
