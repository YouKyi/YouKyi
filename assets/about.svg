<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" fill="none" font-family="'Courier New', ui-monospace, monospace" role="img" aria-label="neofetch: SysAdmin, DevSecOps, PKI - Self-Hosting, Automation, Security">
  <defs>
    <linearGradient id="abody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A1E"/>
      <stop offset="1" stop-color="#0B0712"/>
    </linearGradient>
    <filter id="atext" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="aborder" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="ascan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#E879F9" opacity="0.045"/>
    </pattern>
    <clipPath id="awin"><rect x="10" y="10" width="800" height="280" rx="14"/></clipPath>
    <style>
      text { font-size:17px }
      @keyframes ablink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      @keyframes ain    { from { opacity:0; transform:translateX(-8px) } to { opacity:1; transform:translateX(0) } }
      @keyframes apulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      @keyframes ascanmove { from { transform:translateY(0) } to { transform:translateY(3px) } }
      .acaret { animation:ablink 1.1s steps(1) infinite }
      .aln    { opacity:0; animation:ain .5s ease-out forwards }
      .aglow  { animation:apulse 3s ease-in-out infinite }
      .ascan  { animation:ascanmove .5s linear infinite }
    </style>
  </defs>

  <!-- window -->
  <rect x="10" y="10" width="800" height="280" rx="14" fill="url(#abody)"/>
  <g clip-path="url(#awin)">
    <g class="ascan"><rect x="10" y="7" width="800" height="286" fill="url(#ascan)"/></g>
  </g>
  <rect x="10" y="10" width="800" height="280" rx="14" fill="none" stroke="#BF00FF" stroke-width="1.5" class="aglow" filter="url(#aborder)"/>

  <!-- title bar -->
  <circle cx="38" cy="30" r="6" fill="#BF00FF" filter="url(#atext)"/>
  <circle cx="60" cy="30" r="6" fill="#E879F9" filter="url(#atext)"/>
  <circle cx="82" cy="30" r="6" fill="#8B00CC" filter="url(#atext)"/>
  <text x="410" y="35" text-anchor="middle" font-size="14" fill="#8A6F9E" letter-spacing="1">youkyi@infra: ~</text>
  <line x1="10" y1="50" x2="810" y2="50" stroke="#BF00FF" stroke-opacity="0.35" class="aglow"/>

  <!-- command -->
  <text class="aln" style="animation-delay:.1s" x="30" y="82" filter="url(#atext)">
    <tspan fill="#BF00FF">youkyi@infra:~$</tspan><tspan fill="#F3E8FF"> neofetch </tspan><tspan class="acaret" fill="#BF00FF">&#9608;</tspan>
  </text>

  <!-- ascii tux -->
  <text class="aln" style="animation-delay:.5s" x="34" y="120" xml:space="preserve" fill="#BF00FF" filter="url(#atext)"><tspan x="34" dy="0">   .--.</tspan><tspan x="34" dy="23">  |o_o |</tspan><tspan x="34" dy="23">  |:_/ |</tspan><tspan x="34" dy="23"> //   \ \</tspan><tspan x="34" dy="23">(|     | )</tspan><tspan x="34" dy="23">/'\_   _/`\</tspan><tspan x="34" dy="23">\___)=(___/</tspan></text>

  <!-- info -->
  <g filter="url(#atext)">
    <text class="aln" style="animation-delay:.70s" x="215" y="120"><tspan fill="#E879F9">Identity ..:</tspan><tspan fill="#F3E8FF"> Alexandre Agasseau · @YouKyi</tspan></text>
    <text class="aln" style="animation-delay:.82s" x="215" y="143"><tspan fill="#E879F9">Role ......:</tspan><tspan fill="#F3E8FF"> SysAdmin // DevSecOps // PKI</tspan></text>
    <text class="aln" style="animation-delay:.94s" x="215" y="166"><tspan fill="#E879F9">Focus .....:</tspan><tspan fill="#F3E8FF"> Self-Hosting · Automation · Security</tspan></text>
    <text class="aln" style="animation-delay:1.06s" x="215" y="189"><tspan fill="#E879F9">Approach ..:</tspan><tspan fill="#F3E8FF"> automation-first · defense in depth</tspan></text>
    <text class="aln" style="animation-delay:1.18s" x="215" y="212"><tspan fill="#E879F9">Scope .....:</tspan><tspan fill="#F3E8FF"> bare-metal -&gt; cloud, 24/7</tspan></text>
    <text class="aln" style="animation-delay:1.30s" x="215" y="235"><tspan fill="#E879F9">Mindset ...:</tspan><tspan fill="#F3E8FF"> redteam-aware · zero-trust</tspan></text>
    <text class="aln" style="animation-delay:1.42s" x="215" y="258"><tspan fill="#E879F9">Motto .....:</tspan><tspan fill="#E879F9"> fix the system, not the symptom</tspan></text>
  </g>
</svg>
