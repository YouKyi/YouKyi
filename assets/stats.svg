<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="820" height="300" fill="none" font-family="'Courier New', ui-monospace, monospace" role="img" aria-label="github stats for YouKyi">
  <defs>
    <linearGradient id="gbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140A1E"/>
      <stop offset="1" stop-color="#0B0712"/>
    </linearGradient>
    <filter id="gtext" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.1" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gborder" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="gscan" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect width="3" height="1" fill="#E879F9" opacity="0.045"/>
    </pattern>
    <clipPath id="gwin"><rect x="10" y="10" width="800" height="280" rx="14"/></clipPath>
    <style>
      text { font-size:17px }
      @keyframes gblink { 0%,50% { opacity:1 } 51%,100% { opacity:0 } }
      @keyframes gin    { from { opacity:0; transform:translateX(-8px) } to { opacity:1; transform:translateX(0) } }
      @keyframes gpulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      @keyframes gdotpulse { 0%,100% { opacity:.55; r:5 } 50% { opacity:1; r:6 } }
      @keyframes gscanmove { from { transform:translateY(0) } to { transform:translateY(3px) } }
      .gcaret { animation:gblink 1.1s steps(1) infinite }
      .sln    { opacity:0; animation:gin .5s ease-out forwards }
      .gglow  { animation:gpulse 3s ease-in-out infinite }
      .gdot   { animation:gdotpulse 2s ease-in-out infinite }
      .gscan  { animation:gscanmove .5s linear infinite }
    </style>
  </defs>

  <rect x="10" y="10" width="800" height="280" rx="14" fill="url(#gbody)"/>
  <g clip-path="url(#gwin)">
    <g class="gscan"><rect x="10" y="7" width="800" height="286" fill="url(#gscan)"/></g>
  </g>
  <rect x="10" y="10" width="800" height="280" rx="14" fill="none" stroke="#BF00FF" stroke-width="1.5" class="gglow" filter="url(#gborder)"/>

  <circle cx="38" cy="30" r="6" fill="#BF00FF" filter="url(#gtext)"/>
  <circle cx="60" cy="30" r="6" fill="#E879F9" filter="url(#gtext)"/>
  <circle cx="82" cy="30" r="6" fill="#8B00CC" filter="url(#gtext)"/>
  <text x="410" y="35" text-anchor="middle" font-size="14" fill="#8A6F9E" letter-spacing="1">youkyi@infra: ~</text>
  <line x1="10" y1="50" x2="810" y2="50" stroke="#BF00FF" stroke-opacity="0.35" class="gglow"/>

  <text class="sln" style="animation-delay:.1s" x="30" y="84" filter="url(#gtext)">
    <tspan fill="#BF00FF">youkyi@infra:~$</tspan><tspan fill="#F3E8FF"> gh stats --user YouKyi </tspan><tspan class="gcaret" fill="#BF00FF">&#9608;</tspan>
  </text>

  <g filter="url(#gtext)">
    <circle class="gdot" cx="34" cy="114" r="5.5" fill="#34D399"/>
    <text class="sln" style="animation-delay:.55s" x="48" y="119"><tspan fill="#F3E8FF">infra.github</tspan><tspan fill="#8A6F9E"> : private + public activity summary</tspan></text>

    <text class="sln" style="animation-delay:0.75s" x="34" y="150" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">commits</tspan><tspan fill="#8A6F9E"> ......... </tspan><tspan fill="#D8C9E8">49,241</tspan></text>
    <text class="sln" style="animation-delay:0.8s" x="420" y="150" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">stars</tspan><tspan fill="#8A6F9E"> ........... </tspan><tspan fill="#D8C9E8">6</tspan></text>
    <text class="sln" style="animation-delay:0.9s" x="34" y="178" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">pull requests</tspan><tspan fill="#8A6F9E"> ... </tspan><tspan fill="#D8C9E8">19</tspan></text>
    <text class="sln" style="animation-delay:0.95s" x="420" y="178" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">issues</tspan><tspan fill="#8A6F9E"> .......... </tspan><tspan fill="#D8C9E8">14</tspan></text>
    <text class="sln" style="animation-delay:1.05s" x="34" y="206" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">repositories</tspan><tspan fill="#8A6F9E"> .... </tspan><tspan fill="#D8C9E8">9</tspan></text>
    <text class="sln" style="animation-delay:1.1s" x="420" y="206" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">followers</tspan><tspan fill="#8A6F9E"> ....... </tspan><tspan fill="#D8C9E8">14</tspan></text>
    <text class="sln" style="animation-delay:1.20s" x="34" y="238" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">lines of code</tspan><tspan fill="#8A6F9E"> ... </tspan><tspan fill="#D8C9E8">236,944 </tspan><tspan fill="#8A6F9E">(</tspan><tspan fill="#34D399">308,253++</tspan><tspan fill="#8A6F9E">, </tspan><tspan fill="#FB7185">71,309--</tspan><tspan fill="#8A6F9E">)</tspan></text>
    <text class="sln" style="animation-delay:1.3s" x="34" y="268" xml:space="preserve"><tspan fill="#BF00FF">  &#9656; </tspan><tspan fill="#E879F9">top langs</tspan><tspan fill="#8A6F9E"> ....... </tspan><tspan fill="#D8C9E8">TypeScript · CSS · Svelte · HTML · JavaScript</tspan></text>
  </g>
</svg>
