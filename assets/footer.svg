<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" fill="none" role="img" aria-label="logout">
  <defs>
    <linearGradient id="fsun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E879F9"/>
      <stop offset="1" stop-color="#8B00CC"/>
    </linearGradient>
    <linearGradient id="ffade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BF00FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#BF00FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fhline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#BF00FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#E879F9" stop-opacity="1"/>
      <stop offset="1" stop-color="#BF00FF" stop-opacity="0"/>
    </linearGradient>
    <filter id="fg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="below"><rect x="0" y="78" width="1000" height="102"/></clipPath>
    <style>
      @keyframes fpulse { 0%,100% { opacity:.5 } 50% { opacity:1 } }
      @keyframes frise  { 0% { transform:translateY(0); opacity:0 } 15% { opacity:.9 } 100% { transform:translateY(-70px); opacity:0 } }
      @keyframes fblink { 0%,49% { opacity:1 } 50%,100% { opacity:0 } }
      .fhalo { animation:fpulse 3s ease-in-out infinite }
      .fp    { animation:frise 6s ease-in infinite }
      .fcar  { animation:fblink 1s steps(1) infinite }
    </style>
  </defs>

  <rect width="1000" height="180" fill="#0B0712"/>

  <!-- striped synthwave sun -->
  <g clip-path="url(#below)">
    <circle cx="500" cy="118" r="46" fill="url(#fsun)" class="fhalo" filter="url(#fg)"/>
    <g stroke="#0B0712" stroke-width="3">
      <line x1="454" y1="104" x2="546" y2="104"/>
      <line x1="454" y1="112" x2="546" y2="112"/>
      <line x1="454" y1="120" x2="546" y2="120"/>
      <line x1="454" y1="128" x2="546" y2="128"/>
    </g>
  </g>

  <!-- perspective grid floor -->
  <g stroke="#BF00FF" stroke-opacity="0.5" stroke-width="1" filter="url(#fg)" clip-path="url(#below)">
    <!-- converging verticals -->
    <line x1="500" y1="80" x2="-220" y2="180"/>
    <line x1="500" y1="80" x2="20"   y2="180"/>
    <line x1="500" y1="80" x2="200"  y2="180"/>
    <line x1="500" y1="80" x2="340"  y2="180"/>
    <line x1="500" y1="80" x2="440"  y2="180"/>
    <line x1="500" y1="80" x2="560"  y2="180"/>
    <line x1="500" y1="80" x2="660"  y2="180"/>
    <line x1="500" y1="80" x2="800"  y2="180"/>
    <line x1="500" y1="80" x2="980"  y2="180"/>
    <line x1="500" y1="80" x2="1220" y2="180"/>
    <!-- receding horizontals -->
    <line x1="0" y1="92"  x2="1000" y2="92"  stroke-opacity="0.35"/>
    <line x1="0" y1="108" x2="1000" y2="108" stroke-opacity="0.45"/>
    <line x1="0" y1="130" x2="1000" y2="130" stroke-opacity="0.55"/>
    <line x1="0" y1="158" x2="1000" y2="158" stroke-opacity="0.7"/>
  </g>

  <!-- horizon glow line -->
  <rect x="0" y="79" width="1000" height="2" fill="url(#fhline)" class="fhalo" filter="url(#fg)"/>

  <!-- rising particles -->
  <g fill="#E879F9" filter="url(#fg)">
    <circle class="fp" cx="180" cy="150" r="1.8" style="animation-delay:0s"/>
    <circle class="fp" cx="360" cy="155" r="1.4" style="animation-delay:1.6s"/>
    <circle class="fp" cx="640" cy="150" r="1.8" style="animation-delay:2.8s"/>
    <circle class="fp" cx="820" cy="155" r="1.4" style="animation-delay:4s"/>
  </g>

  <!-- logout prompt -->
  <g font-family="'Courier New', monospace" font-size="20" filter="url(#fg)">
    <text x="500" y="46" text-anchor="middle" fill="#F3E8FF">youkyi@infra:~$ logout</text>
    <rect class="fcar" x="715" y="30" width="10" height="20" fill="#BF00FF"/>
  </g>
</svg>
